[project]
name = "opendma-haystack"
version = "0.4.0.dev1"
description = "Integration of Enterprise Content Management (ECM) systems with Haystack through toolsets, fetchers, and retrievers"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Stefan Kopf", email = "s.kopf@xaldon.de" }
]
requires-python = ">=3.10,<4"
dependencies = [
    "haystack-ai>=2.0.0,<4.0.0",
    "opendma-api>=0.8.0",
    "opendma-remote>=0.8.0",
    "pydantic>=2",
]
keywords = ["haystack", "opendma", "ecm", "document-loaders", "retrievers", "tools", "agents"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://opendma.org"
Repository = "https://github.com/OpenDMA/opendma-haystack.git"
Documentation = "https://github.com/OpenDMA/opendma-haystack/tree/main/docs"
Issues = "https://github.com/OpenDMA/opendma-haystack/issues"

[project.optional-dependencies]
examples = [
    "docling-haystack>=1.0.0",
    "pypdf>=4",
    "trafilatura>=1.8",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = [
    "haystack",
    "haystack.*",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=opendma_haystack --cov-report=term-missing"
markers = [
    "integration: tests requiring an external OpenDMA tutorial repository and an Alfresco deployment",
]

[tool.coverage.run]
source = ["src/opendma_haystack"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
